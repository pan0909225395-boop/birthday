<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>佳佳專屬慶生邀請</title>

  <!-- 引入全螢幕煙火與 EmailJS 函式庫 -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b0b0e;
      color: #f1f1f1;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* 浪漫星空背景 - 動態 (18s) */
    .stars {
      position: fixed;
      top: -10%;
      left: 0;
      width: 100%;
      height: 120%;
      pointer-events: none;
      background-image: 
        radial-gradient(2px 2px at 20px 30px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 40px 70px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(1.5px 1.5px at 90px 40px, #ffb6c1, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 160px 120px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(1.5px 1.5px at 230px 190px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 300px 60px, #ffb6c1, rgba(0,0,0,0)),
        radial-gradient(1.5px 1.5px at 370px 150px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 450px 80px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(1.5px 1.5px at 520px 220px, #ffffff, rgba(0,0,0,0));
      background-repeat: repeat;
      background-size: 550px 300px;
      opacity: 0.6;
      animation: starMove 18s ease-in-out infinite alternate;
      z-index: 0;
    }

    @keyframes starMove {
      0% { transform: translateY(-30px); }
      100% { transform: translateY(30px); }
    }

    /* 流星特效圖層 */
    .night-sky {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .shooting-star {
      position: absolute;
      top: 0;
      left: 50%;
      width: 100px;
      height: 2px;
      background: linear-gradient(-45deg, rgba(255, 255, 255, 0.9), rgba(255, 182, 193, 0));
      border-radius: 999px;
      filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.6));
      animation: tail 10s ease-in-out infinite, shooting 10s ease-in-out infinite;
      opacity: 0;
    }

    .shooting-star::before {
      content: '';
      position: absolute;
      top: calc(50% - 1px);
      right: 0;
      height: 2px;
      background: linear-gradient(-45deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, 1), rgba(255, 255, 255, 0));
      transform: translateX(50%) rotate(45deg);
      border-radius: 100%;
    }

    .shooting-star:nth-child(1) {
      top: 8%;
      left: 75%;
      animation-delay: 1s;
    }

    .shooting-star:nth-child(2) {
      top: 22%;
      left: 60%;
      animation-delay: 6s;
    }

    @keyframes tail {
      0% { width: 0; opacity: 0; }
      10% { width: 120px; opacity: 0.9; }
      25% { width: 0; opacity: 0; }
      100% { width: 0; opacity: 0; }
    }

    @keyframes shooting {
      0% { transform: translateX(0) translateY(0) rotate(-35deg); }
      30% { transform: translateX(-400px) translateY(400px) rotate(-35deg); }
      100% { transform: translateX(-400px) translateY(400px) rotate(-35deg); }
    }

    /* 中間質感卡片 */
    .card {
      background: rgba(35, 37, 45, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 32px 24px;
      width: 90%;
      max-width: 440px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      z-index: 10;
      position: relative;
      transition: all 0.3s ease;
    }

    .cat-img {
      width: 140px;
      height: 140px;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid #ff4d6d;
      box-shadow: 0 0 15px rgba(255, 77, 109, 0.4);
      margin-bottom: 16px;
    }

    h1 {
      font-size: 1.4rem;
      color: #ffffff;
      margin-bottom: 8px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .subtitle {
      font-size: 0.85rem;
      color: #ff85a1;
      margin-bottom: 16px;
      font-weight: 400;
    }

    .description {
      font-size: 0.92rem;
      color: #d1d5db;
      line-height: 1.8;
      margin-bottom: 20px;
      text-align: center;
    }

    .description p {
      margin-bottom: 4px;
    }

    .btn-group {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      min-height: 60px;
      position: relative;
      margin-top: 10px;
    }

    .btn {
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      outline: none;
      transition: transform 0.15s ease-out, background-color 0.2s, box-shadow 0.2s;
      white-space: nowrap;
      user-select: none;
    }

    .btn-yes {
      background: linear-gradient(135deg, #ff4d6d, #ff758f);
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(255, 77, 109, 0.4);
      z-index: 12;
    }

    .btn-yes:hover {
      box-shadow: 0 6px 20px rgba(255, 77, 109, 0.6);
    }

    .btn-no {
      background-color: #4b5563;
      color: #e5e7eb;
      z-index: 11;
      position: relative;
      transition: transform 0.15s ease-out, left 0.15s ease-out, top 0.15s ease-out;
    }

    .hint-text {
      margin-top: 18px;
      font-size: 0.9rem;
      color: #ff85a1;
      height: 24px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    .page {
      display: none;
    }

    /* 月曆整體容器 */
    .calendar-container {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .calendar-header {
      font-size: 1.1rem;
      font-weight: 600;
      color: #ff85a1;
      margin-bottom: 12px;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .weekday {
      font-size: 0.75rem;
      color: #9ca3af;
      font-weight: 600;
      padding-bottom: 6px;
    }

    .day {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      border-radius: 10px;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      transition: all 0.2s;
    }

    .day:hover {
      background: rgba(255, 77, 109, 0.3);
    }

    .day.empty {
      background: transparent;
      cursor: default;
    }

    .day.selected {
      background: linear-gradient(135deg, #ff4d6d, #ff758f);
      color: #ffffff;
      font-weight: bold;
      box-shadow: 0 0 10px rgba(255, 77, 109, 0.6);
      transform: scale(1.05);
    }

    .btn-confirm-pink {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #e879f9, #f43f5e);
      color: #ffffff;
      font-size: 1.1rem;
      font-weight: 600;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(244, 63, 94, 0.4);
      transition: all 0.2s;
    }

    /* 信封造型卡片 */
    .letter-box {
      background: rgba(255, 255, 255, 0.95);
      color: #333333;
      border-radius: 16px;
      padding: 24px 20px;
      text-align: left;
      position: relative;
      margin-top: 15px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    .envelope-header {
      text-align: center;
      margin-bottom: 12px;
    }

    .envelope-icon {
      font-size: 3.8rem;
      line-height: 1;
    }

    .letter-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #1f2937;
      margin-bottom: 12px;
    }

    .letter-content p {
      font-size: 0.92rem;
      color: #4b5563;
      line-height: 1.7;
      margin-bottom: 10px;
    }

    .btn-see-you {
      display: block;
      margin-left: auto;
      margin-top: 15px;
      background: linear-gradient(135deg, #f43f5e, #fb7185);
      color: #ffffff;
      border: none;
      padding: 10px 20px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(244, 63, 94, 0.3);
      transition: transform 0.2s;
    }

    .btn-see-you:hover {
      transform: scale(1.05);
    }

    .btn-reselect {
      background: transparent;
      border: none;
      color: #9ca3af;
      font-size: 0.85rem;
      margin-top: 16px;
      cursor: pointer;
      text-decoration: underline;
    }

    /* 成功預約彈窗 */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.8);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: #1f2937;
      border-radius: 20px;
      padding: 30px 24px;
      text-align: center;
      max-width: 320px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 15px 30px rgba(0,0,0,0.7);
    }

    .modal-content h2 {
      color: #ff758f;
      font-size: 1.4rem;
      margin-bottom: 10px;
    }

    .modal-content p {
      color: #e5e7eb;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 20px;
      white-space: pre-line;
    }

    .modal-btn {
      background: #ff4d6d;
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 20px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="stars"></div>

  <!-- 流星特效圖層 -->
  <div class="night-sky">
    <div class="shooting-star"></div>
    <div class="shooting-star"></div>
  </div>

  <!-- 第一頁：邀請函 -->
  <div class="card" id="page1">
    <img src="0.jpg" alt="貓咪照片" class="cat-img" onerror="this.src='https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=300'">
    
    <h1>要不要跟我一起慶生？</h1>
    
    <div class="description">
      <p>佳佳妳生日馬上要到了</p>
      <p>我生日那天有妳陪我一起做蛋糕我覺得很開心</p>
      <p>這次我也想幫妳過生日，一起做甜點吧</p>
      <p>不確定妳哪一天方便，在月曆點選妳方便的一天吧～</p>
    </div>

    <div class="btn-group" id="btnGroup">
      <button class="btn btn-yes" id="yesBtn" onclick="goToPage2()">好！一起去吧🎂</button>
      <button class="btn btn-no" id="noBtn" onclick="handleNoClick()">再想想看</button>
    </div>

    <div class="hint-text" id="hintText"></div>
  </div>

  <!-- 第二頁：月曆選擇日期 -->
  <div class="card page" id="page2">
    <div style="font-size: 2rem; margin-bottom: 6px;">📅🐾</div>
    
    <h1>請選擇你可以的一天？</h1>
    <div class="subtitle">(點擊月曆選一天吧)</div>
    
    <!-- 互動月曆 -->
    <div class="calendar-container">
      <div class="calendar-header">2026 年 10 月</div>
      <div class="calendar-grid">
        <div class="weekday">日</div>
        <div class="weekday">一</div>
        <div class="weekday">二</div>
        <div class="weekday">三</div>
        <div class="weekday">四</div>
        <div class="weekday">五</div>
        <div class="weekday">六</div>

        <!-- 空白填補 (2026/10/1 是星期四) -->
        <div class="day empty"></div>
        <div class="day empty"></div>
        <div class="day empty"></div>
        <div class="day empty"></div>

        <!-- 日期 1 ~ 31 -->
        <div class="day" onclick="selectDate(this, '10/1')">1</div>
        <div class="day" onclick="selectDate(this, '10/2')">2</div>
        <div class="day" onclick="selectDate(this, '10/3')">3</div>
        <div class="day" onclick="selectDate(this, '10/4')">4</div>
        <div class="day" onclick="selectDate(this, '10/5')">5</div>
        <div class="day" onclick="selectDate(this, '10/6')">6</div>
        <div class="day" onclick="selectDate(this, '10/7')">7</div>
        <div class="day" onclick="selectDate(this, '10/8')">8</div>
        <div class="day" onclick="selectDate(this, '10/9')">9</div>
        <div class="day" onclick="selectDate(this, '10/10')">10</div>
        <div class="day" onclick="selectDate(this, '10/11')">11</div>
        <div class="day" onclick="selectDate(this, '10/12')">12</div>
        <div class="day" onclick="selectDate(this, '10/13')">13</div>
        <div class="day" onclick="selectDate(this, '10/14')">14</div>
        <div class="day" onclick="selectDate(this, '10/15')">15</div>
        <div class="day" onclick="selectDate(this, '10/16')">16</div>
        <div class="day" onclick="selectDate(this, '10/17')">17</div>
        <div class="day" onclick="selectDate(this, '10/18')">18</div>
        <div class="day" onclick="selectDate(this, '10/19')">19</div>
        <div class="day" onclick="selectDate(this, '10/20')">20</div>
        <div class="day" onclick="selectDate(this, '10/21')">21</div>
        <div class="day" onclick="selectDate(this, '10/22')">22</div>
        <div class="day" onclick="selectDate(this, '10/23')">23</div>
        <div class="day" onclick="selectDate(this, '10/24')">24</div>
        <div class="day" onclick="selectDate(this, '10/25')">25</div>
        <div class="day" onclick="selectDate(this, '10/26')">26</div>
        <div class="day" onclick="selectDate(this, '10/27')">27</div>
        <div class="day" onclick="selectDate(this, '10/28')">28</div>
        <div class="day" onclick="selectDate(this, '10/29')">29</div>
        <div class="day" onclick="selectDate(this, '10/30')">30</div>
        <div class="day" onclick="selectDate(this, '10/31')">31</div>
      </div>
    </div>

    <button class="btn-confirm-pink" onclick="confirmDate()">就這天</button>
  </div>

  <!-- 第三頁：動態信封頁面 -->
  <div class="card page" id="page3" style="background: rgba(243, 244, 246, 0.92); color: #1f2937;">
    <div class="envelope-header">
      <div class="envelope-icon">✉️</div>
    </div>
    
    <div class="letter-box">
      <div class="letter-title" id="letterTitle">給願意留時間給我的妳：</div>
      <div class="letter-content" id="letterContent">
        <!-- 信封內容會根據選取的日期動態切換 -->
      </div>

      <button class="btn-see-you" onclick="submitReservation()">到時候見</button>
    </div>

    <button class="btn-reselect" onclick="backToPage2()">再看一次</button>
  </div>

  <!-- 成功預約彈窗 -->
  <div class="modal-overlay" id="successModal">
    <div class="modal-content">
      <h2>🎉 預約成功！</h2>
      <p id="modalMsg">太棒了！通知已經寄出囉，到時候見</p>
      <button class="modal-btn" onclick="closeModal()">太好了！</button>
    </div>
  </div>

  <script>
    // 初始化 EmailJS
    (function(){
      emailjs.init("lfbXrnJi_u_qdX2ev"); 
    })();

    let noClickCount = 0;
    let yesScale = 1;
    let noScale = 1;
    let selectedDateVal = null;

    const hints = [
      "按太快了哦 再考慮一下",
      "這次甜點菜單不錯哦",
      "直接按紅色了啦！",
      "再想想我原地爆炸",
      "點不到了吧",
      "啊哈 看來只能答應了"
    ];

    function handleNoClick() {
      const noBtn = document.getElementById('noBtn');
      const yesBtn = document.getElementById('yesBtn');
      const hintText = document.getElementById('hintText');

      if (noClickCount < hints.length) {
        hintText.innerText = hints[noClickCount];
      } else {
        hintText.innerText = hints[hints.length - 1];
      }

      noClickCount++;

      yesScale += 0.15;
      noScale = Math.max(0.2, noScale - 0.15);

      yesBtn.style.transform = `scale(${yesScale})`;
      noBtn.style.transform = `scale(${noScale})`;

      const maxX = (window.innerWidth - 100) / 2;
      const maxY = (window.innerHeight - 100) / 2;

      const randomX = (Math.random() - 0.5) * maxX * 1.5;
      const randomY = (Math.random() - 0.5) * maxY * 1.5;

      noBtn.style.position = 'fixed';
      noBtn.style.left = `calc(50% + ${randomX}px)`;
      noBtn.style.top = `calc(65% + ${randomY}px)`;
    }

    function goToPage2() {
      document.getElementById('page1').style.display = 'none';
      document.getElementById('page2').style.display = 'block';
    }

    /* 月曆選擇邏輯 */
    function selectDate(element, dateStr) {
      const allDays = document.querySelectorAll('.day');
      allDays.forEach(d => d.classList.remove('selected'));

      element.classList.add('selected');
      selectedDateVal = dateStr;
    }

    function confirmDate() {
      if (!selectedDateVal) {
        alert('請先在月曆上點選一個日期喔！');
        return;
      }

      document.getElementById('page2').style.display = 'none';
      document.getElementById('page3').style.display = 'block';

      const letterTitle = document.getElementById('letterTitle');
      const letterContent = document.getElementById('letterContent');

      /* 根據日期動態替換信封內容 */
      if (selectedDateVal === '10/1') {
        letterTitle.innerText = "給願意把前一天留給我的妳：";
        letterContent.innerHTML = `
          <p>很開心妳沒有拒絕我的邀約，雖然也沒有拒絕可以按就是了哈哈哈</p>
          <p>那天不用想太多，準備好之後我下午開車去接妳🚗</p>
          <p>至於做完蛋糕後要去哪、吃什麼不用想太多</p>
          <p>ok的話就按右下角送出吧</p>
        `;
      } else if (selectedDateVal === '10/2') {
        letterTitle.innerText = "給願意把當天留給我的妳：";
        letterContent.innerHTML = `
          <p>歐吼 當天妳是ok啊 </p>
          <p>很開心當天晚上有留時間給我</p>
          <p>我下班後我們就直接約店家吧 </p>
          <p>至於做完後要去哪、吃什麼不用想太多</p>
          <p>我們可以找個地方吃飯吃蛋糕然後 乾杯！</p>
          <p>ok的話就按右下角送出吧</p>
        `;
      } else {
        letterTitle.innerText = `給願意把 ${selectedDateVal} 留給我的妳：`;
        letterContent.innerHTML = `
          <p>很開心妳願意安排這一天跟我一起過生日！</p>
          <p>那天不用想太多，時間行程我都會準備好，放鬆心情來玩就好囉～</p>
          <p>我們可以找個好地方做甜點、吃飯，祝妳生日快樂！</p>
          <p>ok的話就按右下角送出吧</p>
        `;
      }
    }

    function backToPage2() {
      document.getElementById('page3').style.display = 'none';
      document.getElementById('page2').style.display = 'block';
    }

    /* 點擊到時候見發送通知與爆發煙火 */
    function submitReservation() {
      // 1. 放煙火效果
      confetti({
        particleCount: 120,
        spread: 80,
        origin: { y: 0.6 }
      });

      // 2. 寄送信件給 EmailJS
      emailjs.send("service_4dj7pxc", "template_wi1bhzc", {
        chosen_date: selectedDateVal,
        message: `佳佳已經在慶生網站選擇了 ${selectedDateVal}！`
      }).then(function(response) {
        console.log('SUCCESS!', response.status, response.text);
      }, function(error) {
        console.error('FAILED...', error);
      });

      // 3. 顯示預約成功視窗
      document.getElementById('modalMsg').innerText = `佳佳已成功預約 ${selectedDateVal} 慶生行程！🎉\n通知信已發送給版主，到時候見`;
      document.getElementById('successModal').style.display = 'flex';
    }

    /* 點擊太好了！關閉彈窗並回到首頁 (重置所有狀態) */
    function closeModal() {
      document.getElementById('successModal').style.display = 'none';

      document.getElementById('page2').style.display = 'none';
      document.getElementById('page3').style.display = 'none';
      document.getElementById('page1').style.display = 'block';

      noClickCount = 0;
      yesScale = 1;
      noScale = 1;
      selectedDateVal = null;

      const allDays = document.querySelectorAll('.day');
      allDays.forEach(d => d.classList.remove('selected'));

      const noBtn = document.getElementById('noBtn');
      const yesBtn = document.getElementById('yesBtn');

      yesBtn.style.transform = 'scale(1)';
      noBtn.style.transform = 'scale(1)';
      noBtn.style.position = 'relative';
      noBtn.style.left = 'auto';
      noBtn.style.top = 'auto';

      document.getElementById('hintText').innerText = '';
    }
  </script>
</body>
</html>
